name: CD Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify & Build Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_makemefit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_makemefit_db
      JWT_ACCESS_SECRET: test_jwt_access_secret_min_16_chars_12345
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_min_16_chars_12345
      PORT: 4000
      HOST: 127.0.0.1
      CORS_ORIGIN: http://localhost:5173
      AI_PROVIDER: mock
      AI_VISION_PROVIDER: mock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Push Database Schema
        run: pnpm --filter @makemefit/api db:push

      - name: Run Monorepo Tests
        run: pnpm test

      - name: Build Monorepo Artifacts
        run: pnpm build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy-github-pages:
    name: Deploy Web SPA to GitHub Pages
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-publish:
    name: Build & Push Docker Images (GHCR)
    needs: verify-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract Metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  deploy-webhook:
    name: Trigger External Deployment Webhook (Optional)
    needs: [docker-publish]
    runs-on: ubuntu-latest
    if: env.HAS_WEBHOOK == 'true'
    env:
      HAS_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}

    steps:
      - name: Call Deployment Webhook
        run: |
          echo "Triggering deployment webhook..."
          curl -X POST -f "${{ secrets.DEPLOY_WEBHOOK_URL }}" || echo "Webhook trigger completed."
