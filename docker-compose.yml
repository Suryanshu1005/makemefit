version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: makemefit-postgres
    restart: always
    environment:
      POSTGRES_USER: makemefit_user
      POSTGRES_PASSWORD: makemefit_password
      POSTGRES_DB: makemefit_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makemefit_user -d makemefit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
